name: 02-Workflow Events

on:
   push:
   pull_request:
   workflow_dispatch:
   schedule:
     - cron: '0 0 * * *' # every day at midnight
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Show the trigger
        run:  echo EventName: ${{ github.event_name }} | EventAction: ${{ github.event.action }} | EventRef: ${{ github.ref }} | EventSHA: ${{ github.sha }}